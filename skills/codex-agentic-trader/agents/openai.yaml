interface:
  display_name: "Codex Agentic Trader"
  short_description: "Robinhood 市场研究、金融新闻、确定性风控与自动交易"
  brand_color: "#00C805"
  default_prompt: "Use $codex-agentic-trader to research current markets and financial news, verify the configured Robinhood cash account and orders, apply deterministic risk gates, and execute only clean policy-compliant stock or ETF actions through the fixed workflow."

dependencies:
  tools:
    - type: "mcp"
      value: "robinhood-trading"
      description: "Robinhood official MCP for market data, account reads, order review, placement, cancellation, and status checks."
      transport: "streamable_http"
      url: "https://agent.robinhood.com/mcp/trading"

policy:
  allow_implicit_invocation: true
